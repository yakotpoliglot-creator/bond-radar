name: Отчётность ГИР БО

# Робот собирает бухгалтерскую отчётность эмитентов из ГИР БО ФНС
# и коммитит её в public/girbo.json. Браузер не может обратиться к ФНС
# напрямую — та не отдаёт CORS-заголовок ни на одном своём эндпоинте.
#
# Правовая основа: ГИР БО ведётся ФНС по Федеральному закону № 402-ФЗ
# «О бухгалтерском учёте», ст. 18 и является публичным ресурсом.
# Организации, закрывшие доступ к своей отчётности, помечаются как
# closed и не показываются на сайте — ограничение мы не обходим.
#
# Отчётность годовая, поэтому раз в неделю более чем достаточно.

on:
  schedule:
    # Каждый понедельник в 03:17 UTC — ночью, вне пиковой нагрузки на ФНС
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: girbo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Пульс: защита от отключения расписания самим GitHub ──────
      # GitHub отключает запланированные workflow в публичном
      # репозитории, если в нём не было коммитов 60 дней:
      #   «In a public repository, scheduled workflows are automatically
      #    disabled when no repository activity has occurred in 60 days»
      # Отчётность годовая, поэтому робот коммитит редко — и расписание
      # могло бы отключиться само. Раз в месяц пишем текущий месяц в
      # крошечный файл. Это 12 коммитов в год и гарантия, что робот
      # продолжит работать без чьего-либо участия.
      - name: Пульс — не даём GitHub отключить расписание
        run: echo "$(date -u +%Y-%m)" > .github/last-robot-run.txt

      - name: Собрать отчётность из ГИР БО
        run: node scripts/girbo.mjs

      # Коммитим только если что-то реально изменилось — пустых коммитов
      # не будет. Шаг выполняется даже при сбое сбора, чтобы пульс всё
      # равно прошёл и расписание не отключилось.
      # Коммит и пуш — общим скриптом на всех роботов: он повторяет пуш,
      # переносит свой коммит поверх ветки и разрешает конфликт в файле
      # данных. Прежняя копия этого цикла умирала на первой же неудаче пуша,
      # а конфликт не разрешала вовсе. Разбор — в шапке
      # scripts/commit-robot-data.sh.
      - name: Закоммитить изменения
        if: always()
        run: |
          bash scripts/commit-robot-data.sh "проверка $(date -u +%Y-%m-%d), отчётность ГИР БО" \
            public/girbo.json .github/last-robot-run.txt
