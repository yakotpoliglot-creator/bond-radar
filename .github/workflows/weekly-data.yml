name: Weekly data collection

on:
  schedule:
    # Every Sunday at 6:00 UTC
    - cron: '0 6 * * 0'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run data collection
        run: node scripts/collect-data.mjs

      - name: Commit & push updates
        run: |
          git config user.name "bond-radar-bot"
          git config user.email "bot@bond-radar"
          git add -A
          git diff --cached --quiet || git commit -m "auto: weekly data update $(date +%Y-%m-%d)"
          git push