name: Пробник новостей (временный)

# ВРЕМЕННЫЙ workflow для проверки одного неизвестного: отвечают ли новостные
# ленты с американских адресов GitHub Actions. Прошлый раз это остановило
# работу над агрегатором — мои запросы шли с домашней машины в России.
#
# Отчёт кладём в ОТДЕЛЬНУЮ ветку probe-report: логи, артефакты и сводка
# приватного репозитория закрыты без авторизации, а файл в ветке читается
# обычным API. master при этом не трогается вообще.
#
# В master не попадает: сам workflow живёт в ветке news-probe и удаляется
# вместе с ней.

on:
  push:
    branches:
      - news-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить источники новостей
        run: node scripts/news-probe.mjs 2>&1 | tee probe-report.txt

      - name: Дописать адрес раннера
        if: always()
        run: |
          {
            echo ""
            echo "адрес раннера: $(curl -s --max-time 10 https://ifconfig.me || echo '—')"
          } >> probe-report.txt
          echo "--- отчёт ---"
          cat probe-report.txt

      - name: Положить отчёт в ветку probe-report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-report-tmp 2>/dev/null || git checkout --orphan probe-report-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp probe-report.txt /tmp/probe-report.txt
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/probe-report.txt probe-report.txt
          git add -f probe-report.txt
          git commit -m "Отчёт пробника источников новостей"
          git push -f origin HEAD:probe-report
