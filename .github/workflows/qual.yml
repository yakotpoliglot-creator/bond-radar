name: Допуск выпусков (квалифицированные инвесторы)

# Робот собирает биржевой признак «бумаги для квалифицированных инвесторов»
# (ISQUALIFIEDINVESTORS). Он лежит ТОЛЬКО в описании конкретной бумаги:
# /iss/securities/{SECID}.json — пачкой ISS его не отдаёт. Проверено трижды:
# в списочном блоке площадок TQCB/TQOB (47 полей) признака нет, в агрегатном
# /iss/securities.json (14 полей) нет, а параметры securities= и
# iss.only=description там игнорируются. Один прогон — около 3 100 запросов,
# это 4–6 минут с паузами и пятью потоками.
#
# Почему раз в сутки: допуск меняется редко (новый выпуск, перевод бумаги),
# а лишние обращения к бирже ни к чему. Пульс против отключения расписания —
# как у остальных роботов.

on:
  schedule:
    - cron: '40 4 * * *'
  # Правку самого робота проверяем сразу, а не на следующий день.
  push:
    paths:
      - 'scripts/qual.mjs'
      - '.github/workflows/qual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qual
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Обход трёх тысяч описаний небыстрый: даём запас, чтобы раннер не снял
    # задачу на середине.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Пульс против отключения расписания: GitHub выключает запланированные
      # workflow в публичном репозитории после 60 дней без коммитов.
      - name: Пульс — не даём GitHub отключить расписание
        run: echo "$(date -u +%Y-%m)" > .github/last-robot-run.txt

      - name: Собрать допуск выпусков
        run: node scripts/qual.mjs

      # Данные коммитим даже при неполном прогоне: в файле есть coverage и
      # partial, сайт по ним честно говорит, сколько выпусков проверено.
      # Коммит и пуш — общим скриптом на всех роботов: он повторяет пуш,
      # переносит свой коммит поверх ветки и разрешает конфликт в файле
      # данных. Прежняя копия этого цикла умирала на первой же неудаче пуша,
      # а конфликт не разрешала вовсе. Разбор — в шапке
      # scripts/commit-robot-data.sh.
      - name: Закоммитить изменения
        if: always()
        run: |
          bash scripts/commit-robot-data.sh "допуск выпусков $(date -u +%Y-%m-%d)" \
            public/qual.json .github/last-robot-run.txt
