name: Новости рынка

# Робот собирает новостную ленту о рынке облигаций: тематические рубрики
# «Ведомости. Финансы», «Коммерсантъ. Финансы», новости компаний smart-lab,
# лента Московской биржи плюс поиск Google News по темам (ставка, ОФЗ,
# размещения, рейтинги, дефолты, отчётность).
#
# Почему робот, а не браузер: RSS отдаётся без CORS, из браузера его не
# прочитать. Плюс опрашивать десяток источников каждые 20 минут из каждого
# браузера — это и грубо, и медленно.
#
# Почему раз в 3 часа, а не чаще.
# Сначала стояло каждые 20 минут, и это оказалось расточительством: 72
# прогона в сутки, а GitHub Actions тарифицирует каждое задание минимум
# одной минутой — выходило около 2160 минут в месяц, то есть в разы больше,
# чем все остальные роботы вместе. Сам сбор при этом занимает 6 секунд:
# новости не появляются каждые двадцать минут, и гонять раннер чаще, чем
# раз в три часа, незачем. Так выходит 8 прогонов в сутки, ~240 минут в
# месяц — столько же, сколько уже тратит робот первички.
#
# Робот сам не коммитит, если содержимое не изменилось (сравнивает файл
# без времени сбора), так что пустых коммитов не будет.

on:
  schedule:
    - cron: '10 */3 * * *'
  # Правку самого робота проверяем сразу, а не через три часа.
  push:
    paths:
      - 'scripts/news.mjs'
      - '.github/workflows/news.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Пульс против отключения расписания: GitHub выключает запланированные
      # workflow в публичном репозитории после 60 дней без коммитов.
      - name: Пульс — не даём GitHub отключить расписание
        run: echo "$(date -u +%Y-%m)" > .github/last-robot-run.txt

      - name: Собрать ленту новостей
        run: node scripts/news.mjs

      # Коммит и пуш — общим скриптом на всех роботов: он повторяет пуш,
      # переносит свой коммит поверх ветки и разрешает конфликт в файле
      # данных. Прежняя копия этого цикла умирала на первой же неудаче пуша,
      # а конфликт не разрешала вовсе. Разбор — в шапке
      # scripts/commit-robot-data.sh.
      - name: Закоммитить изменения
        if: always()
        run: |
          bash scripts/commit-robot-data.sh "новости рынка $(date -u +%Y-%m-%d\ %H:%M)" \
            public/news.json .github/last-robot-run.txt
