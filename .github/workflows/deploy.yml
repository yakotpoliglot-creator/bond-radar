name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Коммит, сделанный внутри Actions обычным GITHUB_TOKEN, НЕ порождает
  # событие push — так GitHub защищается от рекурсии. Значит, роботы
  # (отчётность ГИР БО и первичка) своими коммитами выкладку не
  # запускают, и свежие данные на сайт сами не попадают. Поэтому
  # выкладываем сайт ещё и по завершении каждого робота: тогда данные
  # обновляются без чьего-либо участия.
  workflow_run:
    workflows: ["Отчётность ГИР БО", "Первичные размещения"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # По push и в ручном запуске — всегда; по завершении робота — только
    # если робот отработал успешно (иначе он ничего и не закоммитил).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: npm ci && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4