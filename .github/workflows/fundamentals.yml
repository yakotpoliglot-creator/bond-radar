name: МСФО + дивиденды (smart-lab)

# Робот собирает финансовую отчётность (МСФО) и дивиденды компаний
# со страниц smart-lab.ru. Покрытие ~90% ликвидных акций Мосбиржи.
#
# Раз в неделю: финансовая отчётность — годовая, чаще не нужно.

on:
  schedule:
    - cron: '23 6 * * 1'    # понедельник 6:23 UTC
  push:
    paths:
      - 'scripts/fundamentals.mjs'
      - '.github/workflows/fundamentals.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать МСФО и дивиденды
        run: node scripts/fundamentals.mjs

      - name: Закоммитить
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fundamentals.json
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Робот: МСФО и дивиденды $(date -u +%Y-%m-%d)"
            git push
          fi