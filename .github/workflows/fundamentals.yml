name: МСФО + дивиденды (smart-lab)

# Робот собирает финансовую отчётность (МСФО), промежуточные периоды
# и дивиденды компаний со страниц smart-lab.ru. Покрытие ~90% ликвидных
# акций Мосбиржи.
#
# Раз в неделю: годовая отчётность чаще не меняется. Промежуточные
# периоды добавляются каждый квартал, и недельного шага хватает, чтобы
# показать новый отчёт вскоре после публикации.
#
# Три страницы на компанию (годовая, дивиденды, промежуточная), поэтому
# обход идёт около 35–40 минут. Ограничение задачи по умолчанию — шесть
# часов, так что запас большой.

on:
  schedule:
    - cron: '23 6 * * 1'    # понедельник 6:23 UTC
  push:
    paths:
      - 'scripts/fundamentals.mjs'
      - '.github/workflows/fundamentals.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # нужно, чтобы попросить выкладку сайта (шаг ниже)

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать МСФО и дивиденды
        run: node scripts/fundamentals.mjs

      - name: Закоммитить
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fundamentals.json
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Робот: МСФО и дивиденды $(date -u +%Y-%m-%d)"
            # Пуш может не пройти, если в ветку успел что-то положить другой
            # робот или человек: git отвергает такой пуш целиком, и данные
            # всего прогона теряются. Именно так упал прогон 03.10: сборка
            # отработала, а коммит не прошёл — в это же время в master
            # пушили правки сайта. Пробуем трижды, перебазируясь поверх того,
            # что уже лежит в ветке.
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Пуш не прошёл, попытка $i — перебазируемся"
              git pull --rebase --autostash || git rebase --abort
              sleep 5
            done
            echo "Не удалось запушить за три попытки"
            exit 1
          fi

      # Выкладку просим явно, а не надеемся только на workflow_run в deploy.yml.
      #
      # Почему так. Коммит из Actions обычным токеном не вызывает событие
      # push, поэтому deploy.yml ловит завершение роботов через workflow_run.
      # Остальные роботы так и работают, но у этого первый запуск прошёл
      # впустую: его имя в списке deploy.yml появилось тем же пушем, которым
      # он сам запустился, и выкладка по завершении не стартовала — данные
      # закоммитились, а на сайте их не было. Проверено по журналу запусков.
      #
      # workflow_dispatch — единственное событие, которое токен Actions
      # запускать МОЖЕТ (push и workflow_run он подавляет). Поэтому здесь
      # оно надёжнее. Список в deploy.yml оставлен как второй путь.
      - name: Попросить выкладку сайта
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master