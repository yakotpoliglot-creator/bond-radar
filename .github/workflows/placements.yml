name: Первичные размещения

# Робот собирает анонсы размещений облигаций из сообщений Московской
# биржи и коммитит разобранное в public/placements.json.
#
# Почему робот, а не браузер: список новостей биржи
# (iss.moex.com/iss/sitenews.json) читается из браузера напрямую — там
# есть CORS. А тексты сообщений лежат обычными HTML-страницами на
# www.moex.com и CORS-заголовка не отдают, из браузера их не взять.
#
# Правовая основа: биржа сама публикует эти сообщения для участников
# торгов на своём открытом сайте. Мы читаем только их, ничего не
# обходим, не авторизуемся и не подделываем заголовки; в каждой карточке
# на сайте стоит ссылка на первоисточник.
#
# Раз в три часа: анонсы появляются в течение торгового дня, чаще
# опрашивать биржу незачем. Коммит робота запускает обычную выкладку
# сайта, поэтому данные на странице обновляются сами.

on:
  schedule:
    - cron: '23 */3 * * *'
  # Правку самого робота проверяем сразу: иначе ошибку в разборе
  # заметишь только через три часа, да и то если полезешь в логи.
  push:
    paths:
      - 'scripts/placements.mjs'
      - '.github/workflows/placements.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: placements
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Пульс: защита от отключения расписания самим GitHub ──────
      # GitHub отключает запланированные workflow в публичном
      # репозитории, если в нём не было коммитов 60 дней. Робот сам
      # коммитит данные, но если размещений не будет месяц (каникулы
      # на рынке), коммитов не станет и расписание может отключиться.
      # Поэтому раз в месяц пишем текущий месяц в крошечный файл.
      - name: Пульс — не даём GitHub отключить расписание
        run: echo "$(date -u +%Y-%m)" > .github/last-robot-run.txt

      - name: Собрать анонсы размещений
        run: node scripts/placements.mjs

      # Коммитим только если данные реально изменились — робот сам
      # сравнивает результат с прошлым файлом. Шаг выполняется даже при
      # сбое сбора, чтобы пульс всё равно прошёл.
      - name: Закоммитить изменения
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/placements.json .github/last-robot-run.txt
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "Робот: первичные размещения $(date -u +%Y-%m-%d)"
            git push
          fi
